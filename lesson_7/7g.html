<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 7g</title>
    <style>
        .cat-photo{
            height: 40px;
            width: 40px;   
            object-fit: cover;
            object-position: center;
            border-radius: 50%;   
        }
        .search-bar{
            margin-top:7px;
            vertical-align: top;
            font-size: 15px;
            padding: 6px;
            border: none;
        }
        button{
            background-color: rgb(38, 124, 236);
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 20px;
            margin-top: 5px;
            vertical-align:top;
        }
    </style>
</head>
<body>
    <img src="cat_image.jfif" class="cat-photo">
    <input type="text" placeholder="What's happening?" class="search-bar">
    <button>Tweet</button>
</body>
</html>
